{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">
    <div class="glass-card" style="max-width:420px; width:100%;">
        <h2 class="fw-bold mb-1" style="background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Create Account</h2>
        <p class="text-muted mb-4">Register as a student.</p>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold small">USERNAME</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small">PASSWORD</label>
                <input type="password" name="password" class="form-control" minlength="6" required>
                <small class="text-muted">At least 6 characters.</small>
            </div>
            <button class="btn btn-primary w-100">Sign Up</button>
        </form>
        <p class="text-center mt-3 mb-0 text-muted">Have an account? <a href="/login">Log in</a></p>
    </div>
</div>
{% endblock %}
